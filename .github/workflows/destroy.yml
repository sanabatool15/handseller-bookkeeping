name: Destroy Handseller environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - develop
          - test
          - prod
      confirm:
        description: "Type the environment name to confirm"
        required: true

permissions:
  id-token: write
  contents: read

env:
  DEFAULT_AWS_REGION: eu-north-1
  TARGET_ENV: ${{ inputs.environment }}

concurrency:
  group: handseller-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$TARGET_ENV" ]; then
            echo "Confirmation '$CONFIRM' does not match environment '$TARGET_ENV'"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-destroy
          aws-region: ${{ env.DEFAULT_AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Write app secrets (Terraform needs the variable even to destroy)
        env:
          TF_SECRETS: ${{ secrets.TF_SECRETS }}
        run: |
          test -n "$TF_SECRETS" || { echo "Repository secret TF_SECRETS is missing"; exit 1; }
          printf '%s\n' "$TF_SECRETS" > "terraform/secrets.${TARGET_ENV}.tfvars"

      - name: Destroy
        run: |
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh "$TARGET_ENV"
