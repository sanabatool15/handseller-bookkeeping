# One command to run the app:   docker compose up --build
# Uses the SQL Server that is already installed on YOUR machine (for example .\SQLEXPRESS); no SQL Server container.
# Needs a root .env file (git-ignored) with:
#   MSSQL_PASSWORD=<password of your SQL login>      (required)
#   MSSQL_USER=sa                                    (optional, default sa)
#   MSSQL_PORT=1433                                  (optional, the fixed TCP port of your instance)
# Setup steps for SQL Server itself (TCP/IP, SQL login, firewall) are in README.md.
#   frontend http://localhost:3000    API docs http://localhost:8000/docs    Inngest http://localhost:8288

name: handseller

services:
  # One-shot: runs sql_server/01..07 on your SQL Server (creates HandsellerDB; re-runnable), then exits.
  db-init:
    build: ./api
    command: ["python", "scripts/apply_sql.py", "/sql_server"]
    environment: &mssql-env
      MSSQL_SERVER: host.docker.internal,${MSSQL_PORT:-1433}   # your Windows SQL Server, seen from inside Docker
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:?set MSSQL_PASSWORD in a root .env file}
      MSSQL_DATABASE: HandsellerDB
      MSSQL_TRUST_SERVER_CERTIFICATE: "1"
    volumes:
      - ./sql_server:/sql_server:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # already built in on Docker Desktop; needed on plain Linux
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    command: ["uvicorn", "core.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - path: ./api/.env             # optional: OPENAI_API_KEY, JWT_SECRET, ...
        required: false
    environment:
      <<: *mssql-env
      REDIS_URL: redis://redis:6379/0
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_DEV: "1"
      ENABLE_DB_LAB: ${ENABLE_DB_LAB:-true}   # demo-only concurrency lab; set false for anything but local use
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app                   # live reload while you edit the backend
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "dev", "-u", "http://api:8000/api/inngest", "--host", "0.0.0.0"]
    ports:
      - "8288:8288"
    depends_on:
      - api

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      API_PROXY_DEST: http://api:8000/:path*   # the container serves unprefixed routes (see next.config.ts)
      NEXT_PUBLIC_API_URL: /api
      WATCHPACK_POLLING: "true"                # file watching on Windows/macOS bind mounts
    volumes:
      - ./:/app
      - /app/node_modules                      # keep Linux node_modules out of your host folder
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
