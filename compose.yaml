# One command to run the whole stack:   docker compose up --build
#   frontend  http://localhost:3000      API docs  http://localhost:8000/docs
#   Inngest   http://localhost:8288      SSMS      server "localhost,1433", login sa, password MSSQL_SA_PASSWORD (below)
# Optional overrides (shell env or a root .env file): MSSQL_SA_PASSWORD, ENABLE_DB_LAB, plus OPENAI_API_KEY etc. in api/.env.

name: handseller

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64            # runs under emulation on Apple Silicon
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Handseller_Dev1!}   # must meet SQL Server's complexity rules
    ports:
      - "1433:1433"                  # so SSMS on your machine can connect
    volumes:
      - mssql-data:/var/opt/mssql

  # One-shot: runs sql_server/01..07 (re-runnable), then exits.
  db-init:
    build: ./api
    command: ["python", "scripts/apply_sql.py", "/sql_server"]
    environment: &mssql-env
      MSSQL_SERVER: mssql
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:-Handseller_Dev1!}
      MSSQL_DATABASE: HandsellerDB
      MSSQL_TRUST_SERVER_CERTIFICATE: "1"
    volumes:
      - ./sql_server:/sql_server:ro
    depends_on:
      - mssql
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    command: ["uvicorn", "core.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - path: ./api/.env             # optional: OPENAI_API_KEY, JWT_SECRET, ...
        required: false
    environment:
      <<: *mssql-env
      REDIS_URL: redis://redis:6379/0
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_DEV: "1"
      ENABLE_DB_LAB: ${ENABLE_DB_LAB:-true}   # demo-only concurrency lab; set false for anything but local use
    volumes:
      - ./api:/app                   # live reload while you edit the backend
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "dev", "-u", "http://api:8000/api/inngest", "--host", "0.0.0.0"]
    ports:
      - "8288:8288"
    depends_on:
      - api

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      API_PROXY_DEST: http://api:8000/:path*   # the container serves unprefixed routes (see next.config.ts)
      NEXT_PUBLIC_API_URL: /api
      WATCHPACK_POLLING: "true"                # file watching on Windows/macOS bind mounts
    volumes:
      - ./:/app
      - /app/node_modules                      # keep Linux node_modules out of your host folder
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mssql-data:
